services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pydblog-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Af1uente!LabPwd}
      MSSQL_PID: "Developer"
      # SQL Server Agent runs the CDC capture/cleanup jobs. Without it, sp_cdc_enable_table
      # succeeds but change tables never get populated — this is the #1 CDC lab gotcha.
      MSSQL_AGENT_ENABLED: "True"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -N -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pydblog-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Af1uente!LabPwd}
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -N
        -i /sql/mssql/01_setup.sql

volumes:
  sqlserver_data:
