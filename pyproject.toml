[project]
name = "pydblog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Caio Nogueira Silva Belfort", email = "caio.belfort@grupomateus.com" }
]
# 3.12 is the floor because of the PEP 695 `type LSN = bytes` in connectors/types.py.
# Nothing else in the codebase needs anything newer, and no dependency asks for more
# than 3.10.
requires-python = ">=3.12"
dependencies = [
    "mssql-python>=1.11.0",
    "polars>=1.43.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "typer>=0.27.0",
]

[project.scripts]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real SQL Server; starts one via testcontainers (requires Docker)",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
# test_mssql.py imports conftest directly, which is only importable because pytest
# puts the test directory on sys.path.
search-path = ["tests"]

# The tests script their stubs through DBLog._connector and DBLog._store, which are
# declared as the SourceConnector and StateStore Protocols — so the stubs' own
# attributes are invisible here. That isolation is the point of typing them as
# Protocols, and it is not worth rewriting ~119 call sites to satisfy the checker.
[[tool.pyrefly.sub-config]]
matches = "tests/**"
errors = { missing-attribute = false }
