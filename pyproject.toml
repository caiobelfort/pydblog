[project]
name = "pydblog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Caio Nogueira Silva Belfort", email = "caio.belfort@grupomateus.com" }
]
requires-python = ">=3.14"
dependencies = [
    "logfire[pydantic]>=4.38.0",
    "mssql-python>=1.11.0",
    "polars>=1.43.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "typer>=0.27.0",
]

[project.scripts]
pydblog = "pydblog:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real SQL Server; starts one via testcontainers (requires Docker)",
]
